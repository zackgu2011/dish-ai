<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>菜品识别 POC · 实拍测试</title>
<link rel="icon" href="data:,">
<style>
  :root{--bg:#f7f6f3;--ink:#2c2c2a;--muted:#6b6a66;--line:#e2e0da;--accent:#639922;--card:#fff}
  *{box-sizing:border-box}
  body{margin:0;padding:1.2rem;background:var(--bg);color:var(--ink);
       font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:44rem;margin:0 auto}
  h1{font-size:1.3rem;margin:0 0 .3rem}
  .sub{color:var(--muted);font-size:.9rem;margin:0 0 1.2rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem;margin-bottom:1rem}
  .card h2{font-size:1rem;margin:0 0 .7rem;font-weight:600}
  button,label.btn{display:inline-block;background:var(--accent);color:#fff;border:0;border-radius:8px;
       padding:.55rem 1rem;font-size:.95rem;cursor:pointer;margin:0 .4rem .4rem 0}
  button:disabled{background:#b5b3ac;cursor:not-allowed}
  button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
  input[type=file]{display:none}
  #status{font-size:.9rem;color:var(--muted);padding:.5rem 0}
  #status.ok{color:var(--accent)}
  #status.err{color:#c0392b}
  canvas,img.preview{max-width:100%;border-radius:8px;margin:.5rem 0}
  .row{display:flex;align-items:center;gap:.7rem;padding:.5rem 0;border-top:1px solid var(--line)}
  .row:first-child{border-top:0}
  .nm{font-weight:600;min-width:6rem}
  .bar{flex:1;height:.55rem;background:var(--line);border-radius:99px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--accent)}
  .pc{font-variant-numeric:tabular-nums;min-width:3.2rem;text-align:right;font-size:.9rem;color:var(--muted)}
  .kcal{font-size:.85rem;color:var(--muted);min-width:7rem}
  .tag{display:inline-block;font-size:.75rem;padding:.1rem .5rem;border-radius:99px;background:var(--bg);
       color:var(--muted);border:1px solid var(--line);margin-left:.4rem}
  table{width:100%;border-collapse:collapse;font-size:.9rem}
  th,td{text-align:left;padding:.4rem .3rem;border-bottom:1px solid var(--line)}
  .big{font-size:1.6rem;font-weight:700;color:var(--accent)}
  .note{font-size:.85rem;color:var(--muted);background:#fffbe9;border:1px solid #f0e2b0;
        border-radius:8px;padding:.7rem .9rem;margin-bottom:1rem}
  code{background:var(--bg);padding:.1rem .3rem;border-radius:4px;font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>菜品识别 POC · 实拍测试</h1>
  <p class="sub">YOLO26n-cls · 10 类食堂同名菜 · ONNX 5.9 MB · 浏览器本地推理（不上传图片）</p>

  <div class="note">
    <strong>怎么测域差异</strong>：把实拍照片<strong>按菜名分文件夹</strong>放好（如 <code>炒青菜/IMG_001.jpg</code>），
    用下面的「批量测试」选中整个文件夹，页面会逐张推理并直接算出真实 top-1 / top-3。
    训练集是网络美食图，食堂实拍准确率会低于 88%，掉多少是判断这个项目值不值得继续的依据。
  </div>

  <div class="card">
    <h2>1 · 模型</h2>
    <div id="status">正在加载模型…</div>
  </div>

  <div class="card">
    <h2>2 · 单张识别</h2>
    <button id="btnFile">选择图片</button>
    <input type="file" id="file" accept="image/*">
    <button id="btnCam" class="sec">打开摄像头</button>
    <button id="btnShot" class="sec" disabled>拍照识别</button>
    <div><video id="cam" autoplay playsinline muted hidden style="max-width:100%;border-radius:8px"></video></div>
    <canvas id="preview" hidden></canvas>
    <div id="result"></div>
  </div>

  <div class="card">
    <h2>3 · 批量测试（按菜名分文件夹）</h2>
    <button id="btnDir">选择文件夹</button>
    <input type="file" id="dir" webkitdirectory multiple accept="image/*">
    <div id="batch"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.min.js"></script>
<script>
let CLASSES = [];   // 从 models/classes.json 动态读，换模型不用改代码
const MODEL = 'models/dish-cls.onnx';
// 热量从 localStorage 的食堂菜品库动态查（key 与 planner.js 一致）
let DISHES = [];
function loadDishes() {
  try { DISHES = JSON.parse(localStorage.getItem('hdfz:planner:dishes:v1') || '[]'); }
  catch (e) { DISHES = []; }
}
function kcalOf(name) {
  if (!DISHES.length) loadDishes();
  const hit = DISHES.find((d) => d.name === name)
    || DISHES.find((d) => d.name && name && (d.name.includes(name) || name.includes(d.name)));
  return hit ? { kcal: Math.round(hit.kcalS), p: hit.pS } : {};
}
const SIZE = 224;

const $ = (s) => document.querySelector(s);
let session = null;

const status = (msg, kind = '') => {
  const el = $('#status');
  el.textContent = msg;
  el.className = kind;
};

async function loadModel() {
  try {
    ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/';
    const cl = await fetch('models/classes.json');
    if (!cl.ok) throw new Error('读不到 models/classes.json');
    CLASSES = await cl.json();
    loadDishes();
    session = await ort.InferenceSession.create(MODEL, { executionProviders: ['wasm'] });
    status('模型已就绪（' + CLASSES.length + ' 类）'
      + (DISHES.length ? '，菜品库 ' + DISHES.length + ' 条' : '，⚠️ 菜品库为空，先打开一次 app.html'),
      DISHES.length ? 'ok' : 'err');
  } catch (e) {
    status('模型加载失败：' + e.message + '　请用本地 http 服务打开（不能双击 file://）', 'err');
  }
}

function toTensor(src) {
  const cv = document.createElement('canvas');
  cv.width = SIZE; cv.height = SIZE;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(src, 0, 0, SIZE, SIZE);
  const { data } = ctx.getImageData(0, 0, SIZE, SIZE);
  const n = SIZE * SIZE;
  const arr = new Float32Array(n * 3);
  for (let i = 0; i < n; i += 1) {
    arr[i] = data[i * 4] / 255;
    arr[n + i] = data[i * 4 + 1] / 255;
    arr[n * 2 + i] = data[i * 4 + 2] / 255;
  }
  return new ort.Tensor('float32', arr, [1, 3, SIZE, SIZE]);
}

async function predict(src) {
  const out = await session.run({ images: toTensor(src) });
  const vals = Array.from(out[Object.keys(out)[0]].data);
  /* Ultralytics 导出的分类 ONNX 输出已经是概率（和为 1），不要再 softmax 一次，
     否则 0.99 会被压成 0.23，置信度显示就错了 */
  const sum = vals.reduce((a, b) => a + b, 0);
  const isProb = Math.abs(sum - 1) < 0.01 && Math.min(...vals) >= 0;
  if (isProb) return vals;
  const mx = Math.max(...vals);
  const ex = vals.map((v) => Math.exp(v - mx));
  const exs = ex.reduce((a, b) => a + b, 0);
  return ex.map((v) => v / exs);
}

function renderTop(probs) {
  const idx = probs.map((p, i) => [i, p]).sort((a, b) => b[1] - a[1]).slice(0, 3);
    const rows = idx.map(([i, p]) => {
    const name = CLASSES[i];
    const k = kcalOf(name);
    return `<div class="row">
      <span class="nm">${name}</span>
      <span class="bar"><i style="width:${(p * 100).toFixed(1)}%"></i></span>
      <span class="pc">${(p * 100).toFixed(1)}%</span>
      <span class="kcal">${k.kcal ? k.kcal + ' kcal · 蛋白 ' + k.p + 'g' : '—'}</span>
    </div>`;
  }).join('');
  $('#result').innerHTML = rows
    + '<p class="sub" style="margin:.8rem 0 0">热量来自食堂菜品库标准份；如果 top-1 不对，看 top-2/top-3 里有没有正确答案。</p>';
}

async function handleImage(src) {
  if (!session) return;
  $('#result').innerHTML = '<p class="sub">识别中…</p>';
  try { renderTop(await predict(src)); }
  catch (e) { $('#result').innerHTML = '<p class="sub">识别失败：' + e.message + '</p>'; }
}

/* ---- 单图 ---- */
$('#btnFile').onclick = () => $('#file').click();
$('#file').onchange = (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const img = new Image();
  img.onload = () => { $('#preview').hidden = true; handleImage(img); };
  img.src = URL.createObjectURL(f);
};
$('#btnCam').onclick = async () => {
  const v = $('#cam');
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    v.srcObject = s; v.hidden = false; v.play();
    $('#btnShot').disabled = false;
    $('#btnCam').textContent = '摄像头已开';
  } catch (e) { status('摄像头不可用（需 https 或 localhost）：' + e.message, 'err'); }
};
$('#btnShot').onclick = () => {
  const v = $('#cam');
  const cv = document.createElement('canvas');
  cv.width = v.videoWidth; cv.height = v.videoHeight;
  cv.getContext('2d').drawImage(v, 0, 0);
  const img = new Image();
  img.onload = () => handleImage(img);
  img.src = cv.toDataURL('image/jpeg');
};

/* ---- 批量：按菜名分文件夹 ---- */
$('#btnDir').onclick = () => $('#dir').click();
$('#dir').onchange = async (e) => {
  const files = [...e.target.files].filter((f) => /image\//.test(f.type));
  if (!files.length || !session) return;
  $('#batch').innerHTML = `<p class="sub">共 ${files.length} 张，推理中…</p>`;
  const stat = {};
  let done = 0;
  for (const f of files) {
    const truth = (f.webkitRelativePath || f.name).split('/')[0];
    const img = new Image();
    await new Promise((res) => { img.onload = res; img.onerror = res; img.src = URL.createObjectURL(f); });
    try {
      const probs = await predict(img);
      const order = probs.map((p, i) => [i, p]).sort((a, b) => b[1] - a[1]);
      const top1 = CLASSES[order[0][0]];
      const top3 = order.slice(0, 3).map(([i]) => CLASSES[i]);
      stat[truth] = stat[truth] || { n: 0, t1: 0, t3: 0, wrong: [] };
      stat[truth].n += 1;
      if (top1 === truth) stat[truth].t1 += 1;
      if (top3.includes(truth)) stat[truth].t3 += 1;
      else stat[truth].wrong.push(top1);
    } catch (_) { /* 跳过读不了的图 */ }
    done += 1;
    if (done % 5 === 0) $('#batch').innerHTML = `<p class="sub">已处理 ${done}/${files.length}…</p>`;
  }
  let n = 0, t1 = 0, t3 = 0;
  const rows = Object.keys(stat).map((k) => {
    const s = stat[k]; n += s.n; t1 += s.t1; t3 += s.t3;
    return `<tr><td>${k}</td><td>${s.n}</td><td>${(s.t1 / s.n * 100).toFixed(0)}%</td>
      <td>${(s.t3 / s.n * 100).toFixed(0)}%</td>
      <td>${s.wrong.slice(0, 3).join('、') || '—'}</td></tr>`;
  }).join('');
  $('#batch').innerHTML = n
    ? `<p class="big">top-1 ${(t1 / n * 100).toFixed(1)}% · top-3 ${(t3 / n * 100).toFixed(1)}%</p>
       <p class="sub">共 ${n} 张。对照：同域 val 是 88.0%（网络美食图），这里才是真实水平。</p>
       <table><tr><th>菜名</th><th>张数</th><th>top-1</th><th>top-3</th><th>常被认成</th></tr>${rows}</table>`
    : '<p class="sub">没有可用的图片</p>';
};

loadModel();
</script>
</body>
</html>
